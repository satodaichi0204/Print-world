<!-- ===================================================================== -->
<!-- お客様編集用 カスタムCSS 枠（★一度だけ設置してください★）             -->
<!--                                                                       -->
<!-- 貼付先: 管理画面 → Mst → ページテーマ →「フッタ」Twig の一番下          -->
<!--                                                                       -->
<!-- ■ 仕組み                                                             -->
<!--   ・Print World の標準CSSは別の場所(Vercel)にあり、ここでは触りません。 -->
<!--   ・この<style>は最後に読み込まれ、標準CSSを「後勝ち」で上書きします。  -->
<!--   ・空のままなら、今の見た目は一切変わりません（安全）。               -->
<!--   ・元に戻したいときは、書き足した行を消すだけでOKです。               -->
<!--                                                                       -->
<!-- ■ 触ってよいのは <style> の中の「編集エリア」だけです。               -->
<!--   その外（このコメントやTwig）は触らないでください。                  -->
<!-- ===================================================================== -->
<style id="pw-custom-css">
/* ▼▼▼▼▼ ここからお客様編集エリア（この中だけ編集OK）▼▼▼▼▼ */


/* --- 使い方 ---
   1) 変えたい箇所をサイト上で「検証(Inspect)」して class名 を調べる
   2) 下の「例」をコピーして、class名 と 値 を書き換える
   3) 行末の !important は消さない（標準CSSに勝つために必要）
   4) 保存 → 実ページを Ctrl+F5 で確認 / 戻したいときは その行を消す
*/

/* 例1) 文字の色を変える
.company-message h2 { color: #d8001a !important; }
*/

/* 例2) 背景の色を変える
.faq-item__question { background-color: #ffd54a !important; }
*/

/* 例3) 文字の大きさを変える（数字を大きく/小さく）
.ap-card__text { font-size: 18px !important; }
*/

/* 例4) ある部分を隠す（非表示にする）
.sample-class { display: none !important; }
*/

/* 例5) 余白（すき間）を広げる/狭める
.company-story { padding-top: 40px !important; }
*/


/* ▲▲▲▲▲ ここまでお客様編集エリア ▲▲▲▲▲ */
</style>
